; PlatformIO Project Configuration File
; Project: Raw Sensor Visualizer for ADXL345 (Vibration Signal Validation)
; Target : ESP32 Dev Module

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -O2
    -DCORE_DEBUG_LEVEL=0
